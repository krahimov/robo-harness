[project]
name = "robot-harness-icrt-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "timm==1.0.20",
    "diffusers==0.35.1",
    "loralib==0.1.2",
    "scipy>=1.15,<2",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
    "tyro>=0.9,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
