[project]
name = "robot-harness-studio"
version = "0.1.0"
description = "Local studio for demonstration-conditioned robotics experiments"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mujoco>=3.3,<4", "numpy>=2,<3", "httpx>=0.28,<1", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
